services:
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: leetcode
      POSTGRES_USER: leetcode
      POSTGRES_PASSWORD: leetcode
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leetcode -d leetcode"]
      interval: 3s
      timeout: 3s
      retries: 10
