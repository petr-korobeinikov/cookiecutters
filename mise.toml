[settings]
disable_backends = ["ubi", "asdf"]
lockfile = true

[tools]
# Installs the pypi: tools below; 0.12.10 and newer let `mise lock` record each tool's full dependency graph.
uv = "0.13.6"
# Built on a Python of its own, which stays off the shell's PATH. 3.14, not 3.15: PyYAML 6.0.3 ships no cp315
# wheels, and the locked graph installs wheels only.
"pypi:cookiecutter" = { version = "2.7.1", python = "3.14.10" }
